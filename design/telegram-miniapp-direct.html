<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>手机卡直连上线 · 不需扫码</title>
  <style>
    :root {
      --bg: oklch(98% 0.005 250);
      --surface: oklch(100% 0 0);
      --surface-soft: oklch(96% 0.012 245);
      --fg: oklch(22% 0.02 240);
      --muted: oklch(50% 0.018 240);
      --border: oklch(90% 0.008 240);
      --accent: oklch(58% 0.16 220);
      --accent-soft: oklch(94% 0.035 220);
      --secondary: oklch(62% 0.14 165);
      --success: oklch(57% 0.15 145);
      --warn: oklch(68% 0.15 75);
      --danger: oklch(58% 0.18 25);
      --shadow: 0 24px 70px rgba(23, 32, 56, 0.12);
      --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --font-mono: "SFMono-Regular", "Cascadia Code", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(circle at 12% 4%, color-mix(in oklch, var(--accent) 10%, transparent), transparent 26rem),
                  linear-gradient(180deg, var(--bg), color-mix(in oklch, var(--bg) 84%, var(--accent-soft)));
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    svg { display: block; }

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-mark {
      width: 42px; height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: white;
      box-shadow: 0 14px 34px color-mix(in oklch, var(--accent) 26%, transparent);
      flex: 0 0 auto;
    }
    .brand h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: color-mix(in oklch, var(--surface) 82%, transparent);
      color: var(--muted);
      font-size: 13px;
      font-weight: 550;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--success) 18%, transparent);
    }
    .workspace {
      display: flex;
      justify-content: center;
      align-items: start;
    }
    .miniapp-shell {
      position: sticky;
      top: 20px;
      border-radius: 38px;
      padding: 10px;
      background: oklch(18% 0.02 245);
      box-shadow: var(--shadow);
    }
    .phone-frame {
      min-height: 640px;
      border-radius: 30px;
      overflow: hidden;
      background: var(--surface);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .phone-status {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      color: var(--fg);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.01em;
      background: color-mix(in oklch, var(--surface) 88%, var(--accent-soft));
    }
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 62px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: color-mix(in oklch, var(--surface) 92%, var(--accent-soft));
    }
    .back-btn {
      width: 38px; height: 38px;
      border: 1px solid var(--border);
      border-radius: 13px;
      display: grid;
      place-items: center;
      background: var(--surface);
      color: var(--fg);
    }
    .back-btn[hidden] { visibility: hidden; display: grid; }
    .step-meta { min-width: 0; text-align: center; }
    .step-meta strong {
      display: block;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .step-meta span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font: 11px/1.2 var(--font-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .miniapp-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 22px 20px 20px;
    }
    .screen { animation: screenIn 260ms ease both; }
    @keyframes screenIn {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .hero-logo {
      width: 74px; height: 74px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      background: var(--accent);
      color: white;
      box-shadow: 0 20px 48px color-mix(in oklch, var(--accent) 30%, transparent);
    }
    .screen-title {
      margin: 0;
      font-family: var(--font-display);
      font-size: clamp(28px, 9vw, 40px);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }
    .screen-copy {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      max-width: 42ch;
    }
    .form-stack {
      display: grid;
      gap: 16px;
      margin-top: 26px;
    }
    .field { display: grid; gap: 7px; }
    .field label {
      color: var(--fg);
      font-size: 13px;
      font-weight: 620;
      letter-spacing: 0.02em;
    }
    .input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: color-mix(in oklch, var(--surface) 90%, var(--surface-soft));
      padding: 0 14px;
      transition: border-color 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }
    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 16%, transparent);
      background: var(--surface);
    }
    .input-row input {
      width: 100%;
      border: 0; outline: 0;
      background: transparent;
      color: var(--fg);
      min-width: 0;
      font-size: 16px;
    }
    .field-hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .icon-button {
      width: 34px; height: 34px;
      flex: 0 0 auto;
      border: 0;
      border-radius: 12px;
      background: color-mix(in oklch, var(--surface-soft) 78%, var(--surface));
      color: var(--muted);
      display: grid;
      place-items: center;
    }
    .flow-card {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      padding: 15px;
      text-align: left;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }
    .flow-card.active {
      border-color: color-mix(in oklch, var(--accent) 58%, var(--border));
      background: color-mix(in oklch, var(--accent-soft) 56%, var(--surface));
    }
    .flow-card strong {
      display: block;
      font-size: 15px;
      letter-spacing: 0;
    }
    .flow-card span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .flow-mark {
      width: 34px; height: 34px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--surface-soft);
      color: var(--muted);
      font: 12px/1 var(--font-mono);
      letter-spacing: 0.04em;
    }
    .flow-card.active .flow-mark {
      background: var(--accent);
      color: white;
    }
    .result-view {
      min-height: 400px;
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
      gap: 16px;
    }
    .result-mark {
      width: 82px; height: 82px;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .result-mark--success {
      background: color-mix(in oklch, var(--success) 16%, var(--surface));
      color: var(--success);
      border: 1px solid color-mix(in oklch, var(--success) 32%, var(--border));
    }
    .result-mark--error {
      background: color-mix(in oklch, var(--danger) 16%, var(--surface));
      color: var(--danger);
      border: 1px solid color-mix(in oklch, var(--danger) 32%, var(--border));
    }
    .bottom-bar {
      margin-top: auto;
      padding-top: 24px;
      display: grid;
      gap: 10px;
    }
    .primary-btn, .secondary-btn {
      min-height: 52px;
      width: 100%;
      border-radius: 17px;
      border: 1px solid transparent;
      font-weight: 660;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
    }
    .primary-btn {
      background: var(--accent);
      color: white;
      box-shadow: 0 16px 34px color-mix(in oklch, var(--accent) 25%, transparent);
    }
    .primary-btn:disabled {
      cursor: not-allowed;
      opacity: 0.52;
      box-shadow: none;
    }
    .secondary-btn {
      background: var(--surface);
      color: var(--fg);
      border-color: var(--border);
    }
    .spinner {
      width: 18px; height: 18px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      border-top-color: white;
      animation: spin 780ms linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      z-index: 20;
      max-width: min(420px, calc(100% - 32px));
      padding: 12px 14px;
      border-radius: 15px;
      background: oklch(20% 0.02 245 / 0.94);
      color: white;
      font-size: 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.24);
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: oklch(19% 0.018 250);
        --surface: oklch(24% 0.018 250);
        --surface-soft: oklch(29% 0.022 250);
        --fg: oklch(93% 0.006 250);
        --muted: oklch(70% 0.012 250);
        --border: oklch(100% 0 0 / 0.12);
        --accent-soft: oklch(31% 0.055 220);
        --shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
      }
    }
    @media (max-width: 900px) {
      .page { width: min(100% - 22px, 640px); padding-top: 18px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .miniapp-shell { position: static; max-width: 460px; width: 100%; margin: 0 auto; }
      .phone-frame { min-height: min(640px, calc(100vh - 92px)); }
    }
    @media (max-width: 430px) {
      .page { width: 100%; padding: 0; }
      .topbar { padding-inline: 14px; }
      .topbar { padding-top: 16px; }
      .status-chip { width: 100%; justify-content: center; }
      .miniapp-shell { padding: 0; border-radius: 0; background: transparent; box-shadow: none; }
      .phone-frame { min-height: 100vh; border-radius: 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M20.4 4.1 3.8 10.8c-1 .4-1 1.8.1 2.1l4.1 1.2 1.6 5c.3 1 1.6 1.2 2.2.4l2.3-3.1 4.2 3.1c.8.6 1.9.1 2-1l2.1-12.6c.2-1.2-.9-2.2-2-1.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
            <path d="m8.2 14 7.5-5.2-5.6 6.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <h1>手机卡上线</h1>
          <p>账号直连链路</p>
        </div>
      </div>
      <div class="status-chip"><span class="status-dot"></span><span id="autosaveLabel">草稿自动保存</span></div>
    </header>

    <section class="workspace" aria-label="Telegram MiniApp 原型">
      <div class="miniapp-shell">
        <div class="phone-frame">
          <div class="phone-status" aria-hidden="true">
            <span>9:41</span>
            <span class="icons">
              <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M1 8.5h2.3m2.2 0h2.3m2.2 0h2.3m2.2 0H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M1 5.5h5m2.5 0h2m2.5 0h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <svg width="20" height="10" viewBox="0 0 20 10" fill="none"><rect x="1" y="1" width="16" height="8" rx="2.5" stroke="currentColor" stroke-width="1.3"/><path d="M19 3.5v3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><rect x="3" y="3" width="10" height="4" rx="1" fill="currentColor"/></svg>
            </span>
          </div>

          <header class="app-header">
            <button class="back-btn" id="backBtn" type="button" aria-label="返回上一步">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M15 5 8 12l7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="step-meta">
              <strong id="headerTitle">欢迎</strong>
              <span id="stepLabel">准备开始</span>
            </div>
            <span class="back-btn" hidden aria-hidden="true"></span>
          </header>

          <div class="miniapp-body">
            <div id="screenHost" class="screen" aria-live="polite"></div>
            <div class="bottom-bar" id="actionBar"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const storageKey = "tg-miniapp-direct-v1";
    const flowInfo = {
      name: "流程二",
      title: "账号直连上线",
      desc: "OTP 校验后直接返回上线结果。",
      accountLabel: "账号",
      accountHint: "",
      accountPlaceholder: "请输入上线账号"
    };

    const defaultState = {
      step: 0,
      account: "",
      pin: "",
      pinVisible: false,
      otp: "",
      otpSent: false,
      otpVerified: false,
      submitting: false,
      completed: false,
      resultRef: "",
      error: false,
      errorMsg: ""
    };

    let state = loadState();
    const screenHost = document.getElementById("screenHost");
    const actionBar = document.getElementById("actionBar");
    const backBtn = document.getElementById("backBtn");
    const toast = document.getElementById("toast");

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey) || "null");
        return { ...defaultState, ...(saved || {}) };
      } catch (_) { return { ...defaultState }; }
    }

    function saveState() {
      const safeState = { ...state, submitting: false };
      localStorage.setItem(storageKey, JSON.stringify(safeState));
      document.getElementById("autosaveLabel").textContent = "草稿已自动保存";
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[c];
      });
    }

    function icon(name) {
      var paths = {
        user: '<path d="M20 21a8 8 0 0 0-16 0"/><circle cx="12" cy="7" r="4"/>',
        sim: '<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M10 3v5h5"/><path d="M9 14h6"/><path d="M9 17h4"/>',
        lock: '<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',
        otp: '<rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 12h.01M12 12h.01M16 12h.01"/>',
        check: '<path d="m5 12 4 4L19 6"/>',
        x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
        eye: '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'
      };
      return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (paths[name] || paths.check) + '</svg>';
    }

    function setState(next) {
      state = Object.assign({}, state, next);
      saveState();
      render();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(function () { toast.classList.remove("show"); }, 2200);
    }

    function mockAccountSubmitResponse() {
      return { requiresQrScan: false, flow: "direct", decisionRef: "DEC-" + String(Date.now()).slice(-6) };
    }

    function getSteps() {
      return [
        { title: "手机卡上线", label: "准备开始", desc: "进入上线流程" },
        { title: "提交账号信息", label: "Step 1", desc: "账号与 PIN" },
        { title: "OTP 校验", label: "Step 2", desc: "输入短信验证码" },
        { title: "上线结果", label: "完成", desc: "展示接口返回结果" }
      ];
    }

    function resultStep() { return 3; }

    function stepIsValid(step) {
      if (step === 1) return state.account.trim().length >= 3 && state.pin.length >= 4;
      if (step === 2) return /^\d{6}$/.test(state.otp);
      return true;
    }

    function render() {
      var steps = getSteps();
      var active = steps[state.step] || steps[steps.length - 1];
      document.getElementById("headerTitle").textContent = active.title;
      document.getElementById("stepLabel").textContent = active.label;
      backBtn.hidden = state.step === 0 || state.submitting;
      screenHost.innerHTML = getScreen();
      actionBar.innerHTML = getActions();
      bindScreenEvents();
    }

    function getScreen() {
      if (state.step === 0) {
        return '<section class="screen">' +
          '<div class="hero-logo">' + icon("sim") + '</div>' +
          '<h2 class="screen-title">手机卡上线申请</h2>' +
          '<p class="screen-copy">OTP 校验通过后直接展示上线结果。</p>' +
          '<div style="margin-top:24px;"><article class="flow-card active">' +
          '<span><strong>账号直连上线</strong><span>提交账号后接收 OTP，校验通过即完成上线。</span></span>' +
          '<span class="flow-mark">直连</span></article></div>' +
          '</section>';
      }

      if (state.step === 1) {
        return '<section class="screen">' +
          '<h2 class="screen-title">提交账号信息</h2>' +
          '<p class="screen-copy">输入上线账号与 PIN，提交后接收 OTP 完成校验。</p>' +
          '<div class="form-stack">' +
          '<div class="field"><label for="account">' + flowInfo.accountLabel + '</label>' +
          '<div class="input-row">' + icon("user") + '<input id="account" inputmode="text" autocomplete="username" value="' + escapeHtml(state.account) + '" placeholder="' + flowInfo.accountPlaceholder + '" /></div>' +

          '<div class="field"><label for="pin">PIN</label>' +
          '<div class="input-row">' + icon("lock") + '<input id="pin" type="' + (state.pinVisible ? "text" : "password") + '" inputmode="numeric" value="' + escapeHtml(state.pin) + '" placeholder="至少 4 位" /><button class="icon-button" id="togglePin" type="button" aria-label="切换 PIN 显示">' + icon("eye") + '</button></div></div>' +
          '</div></section>';
      }

      if (state.step === 2) {
        return '<section class="screen">' +
          '<h2 class="screen-title">输入 OTP</h2>' +
          '<p class="screen-copy">验证码已发送，输入后完成校验。</p>' +
          '<div class="form-stack"><div class="field"><label for="otp">OTP</label>' +
          '<div class="input-row">' + icon("otp") + '<input id="otp" inputmode="numeric" autocomplete="one-time-code" value="' + escapeHtml(state.otp) + '" placeholder="6 位验证码" /></div>' +
          '<span class="field-hint">原型中可输入任意 6 位数字。</span></div></div>' +
          '</section>';
      }

      if (state.error) {
        return '<section class="result-view">' +
          '<div class="result-mark result-mark--error">' + icon("x") + '</div>' +
          '<h2 class="screen-title">上线失败</h2>' +
          '<p class="screen-copy" style="margin:0;">' + escapeHtml(state.errorMsg || "上线过程中出现错误，请稍后重试。") + '</p>' +
          '</section>';
      }

      return '<section class="result-view">' +
        '<div class="result-mark result-mark--success">' + icon("check") + '</div>' +
        '<h2 class="screen-title">上线成功</h2>' +
        '<p class="screen-copy" style="margin:0;">账号已成功上线，可以开始使用了。</p>' +
        '</section>';
    }

    function getActions() {
      if (state.step === 0) return '<button class="primary-btn" id="nextBtn" type="button">开始上线</button>';
      if (state.step === 1) {
        return '<button class="primary-btn" id="submitAccountBtn" type="button"' + (stepIsValid(1) && !state.submitting ? "" : " disabled") + '>' +
          (state.submitting ? '<span class="spinner"></span>提交中...' : "提交") + '</button>';
      }
      if (state.step === 2) {
        return '<button class="primary-btn" id="submitOtpBtn" type="button"' + (stepIsValid(2) && !state.submitting ? "" : " disabled") + '>' +
          (state.submitting ? '<span class="spinner"></span>校验中...' : "提交 OTP") + '</button>' +
          '<button class="secondary-btn" id="resendOtpBtn" type="button">重新发送 OTP</button>';
      }
      return '<button class="primary-btn" id="closeBtn" type="button">关闭 Mini App</button>' +
        '<button class="secondary-btn" id="restartBtn" type="button">重新上线</button>';
    }

    function bindScreenEvents() {
      var nextBtn = document.getElementById("nextBtn");
      if (nextBtn) nextBtn.addEventListener("click", function () { setState({ step: 1 }); });

      var submitAccountBtn = document.getElementById("submitAccountBtn");
      if (submitAccountBtn) {
        submitAccountBtn.addEventListener("click", function () {
          if (!stepIsValid(1)) { showToast("请填写账号并输入至少 4 位 PIN"); return; }
          setState({ submitting: true });
          window.setTimeout(function () {
            var decision = mockAccountSubmitResponse();
            setState({
              submitting: false, otpSent: true, otp: "", step: 2
            });
            showToast("OTP 已发送，接口返回 requiresQrScan=false");
          }, 650);
        });
      }

      var submitOtpBtn = document.getElementById("submitOtpBtn");
      if (submitOtpBtn) {
        submitOtpBtn.addEventListener("click", function () {
          if (!stepIsValid(2)) { showToast("请输入 6 位 OTP"); return; }
          setState({ submitting: true });
          window.setTimeout(function () {
            var ref = "SIM-" + new Date().toISOString().slice(2, 10).replace(/-/g, "") + "-" + Math.floor(1000 + Math.random() * 9000);
            setState({ submitting: false, otpVerified: true, completed: true, resultRef: ref, step: resultStep() });
            showToast("上线结果已返回");
          }, 760);
        });
      }

      var resendOtpBtn = document.getElementById("resendOtpBtn");
      if (resendOtpBtn) resendOtpBtn.addEventListener("click", function () { showToast("OTP 已重新发送"); });

      var closeBtn = document.getElementById("closeBtn");
      if (closeBtn) closeBtn.addEventListener("click", function () { showToast("已触发关闭 Mini App"); });

      var restartBtn = document.getElementById("restartBtn");
      if (restartBtn) {
        restartBtn.addEventListener("click", function () {
          state = Object.assign({}, defaultState);
          saveState();
          render();
        });
      }

      var fieldMap = {
        account: function (v) { return v.trim().slice(0, 32); },
        pin: function (v) { return v.replace(/\D/g, "").slice(0, 8); },
        otp: function (v) { return v.replace(/\D/g, "").slice(0, 6); }
      };

      Object.keys(fieldMap).forEach(function (id) {
        var input = document.getElementById(id);
        if (!input) return;
        input.addEventListener("input", function (event) {
          state[id] = fieldMap[id](event.target.value);
          event.target.value = state[id];
          saveState();
          var submitBtn = document.getElementById("submitAccountBtn") || document.getElementById("submitOtpBtn");
          if (submitBtn) submitBtn.disabled = !stepIsValid(state.step) || state.submitting;
        });
      });

      var togglePin = document.getElementById("togglePin");
      if (togglePin) togglePin.addEventListener("click", function () { setState({ pinVisible: !state.pinVisible }); });
    }

    backBtn.addEventListener("click", function () {
      if (state.step > 0 && !state.submitting) setState({ step: state.step - 1 });
    });

    render();
  </script>
</body>
</html>
